[project]
name = "lsdub"
description = "Open-weights lip-sync for music videos in ComfyUI. LSDub warps the singer's own mouth to the song (no new face, no face swap) and scores every shot, so you know which ones worked. Bring a clip and a song, or generate them with LTX-2.5, Qwen-Image-Edit and ACE-Step."
version = "0.1.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Operating System :: OS Independent",
  "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scipy>=1.10",
  "mediapipe>=0.10.21,<0.10.30",   # one line: the hosted build pins 0.10.21 (pre-0.10.30, numpy<2)
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
  "faster-whisper>=1.0",
  "soundswallower>=0.6",
  "g2p>=2.0",
  "transformers>=4.40",
]

[project.optional-dependencies]
cloud = ["comfy-sdk>=0.5"]   # opt-in Comfy Cloud backend for the generator slots
occluders = ["sam2>=1.1", "hydra-core>=1.3", "iopath"]   # LSDub Occluders (SAM 2.1 video masks; Florence-2 via transformers)
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/HumanjavaEnterprises/comfyui-lsdub"
Documentation = "https://github.com/HumanjavaEnterprises/comfyui-lsdub#readme"
Issues = "https://github.com/HumanjavaEnterprises/comfyui-lsdub/issues"
"Bug Tracker" = "https://github.com/HumanjavaEnterprises/comfyui-lsdub/issues"
Homepage = "https://lsdub.vidbnch.app"

[tool.comfy]
PublisherId = "vveerrgg"
DisplayName = "LSDub"
Icon = "https://raw.githubusercontent.com/HumanjavaEnterprises/comfyui-lsdub/v0.1.10/assets/icon.png"
Banner = "https://raw.githubusercontent.com/HumanjavaEnterprises/comfyui-lsdub/v0.1.10/assets/banner.png"
requires-comfyui = ">=0.3.48"   # the first upstream tag with comfy_api.v0_0_2 (checked 2026-10-29); tested on 0.34
includes = []

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
