[project]
name = "lsdub"
description = "LSDub — open-weights lip-sync for music videos: match the lip-sync to the audio without re-rendering the whole shot. 0.0.1 = the vocal stage (lead-vocal isolation)."
version = "0.0.3"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scipy>=1.10",
  "mediapipe>=0.10.14,<0.11",
  "pillow>=10",
  "faster-whisper>=1.0",
  "soundswallower>=0.6",
  "g2p>=2.0",
  "transformers>=4.40",
]

[project.optional-dependencies]
cloud = ["comfy-sdk>=0.5"]   # opt-in Comfy Cloud backend for the generator slots

[project.urls]
Repository = "https://github.com/HumanjavaEnterprises/comfyui-lsdub"
Documentation = "https://lsdub.vidbnch.app"

[tool.comfy]
PublisherId = "vveerrgg"
DisplayName = "LSDub"

