name: Publish to the Comfy Registry
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  install-path:   # the gate: a tag whose tree fails the clean-ComfyUI install test is never published
    if: github.repository == 'HumanjavaEnterprises/comfyui-lsdub'
    uses: ./.github/workflows/install-path.yml
  publish:
    needs: install-path
    runs-on: ubuntu-latest
    if: github.repository == 'HumanjavaEnterprises/comfyui-lsdub'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Release notes from the top released CHANGELOG section (checked against pyproject)
        run: |
          python3 scripts/release_notes.py --out "$RUNNER_TEMP/notes.md"
          { echo 'COMFY_NODE_CHANGELOG<<LSDUB_NOTES_EOF'; cat "$RUNNER_TEMP/notes.md"; echo 'LSDUB_NOTES_EOF'; } >> "$GITHUB_ENV"
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9   # main, 2026-10
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}   # set this secret in the repo settings
          skip_checkout: 'true'
  site:   # after a good publish: ask the microsite to deploy its main branch (it serves /changelog)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch lsdub-release to the microsite
        env:
          TOKEN: ${{ secrets.MICROSITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Site deploy skipped::MICROSITE_DISPATCH_TOKEN is not set, so the microsite was not asked to deploy. Add it (CONTRIBUTING.md, Releases) or deploy the site by hand."
            exit 0
          fi
          curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HumanjavaEnterprises/lsdub.web.microsite.src/dispatches \
            -d "{\"event_type\":\"lsdub-release\",\"client_payload\":{\"tag\":\"$TAG\"}}"
          echo "::notice title=Site deploy requested::lsdub-release $TAG sent to the microsite"
