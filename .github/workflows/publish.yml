name: Publish to the Comfy Registry
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  install-path:   # the gate: a tag whose tree fails the clean-ComfyUI install test is never published
    if: github.repository == 'HumanjavaEnterprises/comfyui-lsdub'
    uses: ./.github/workflows/install-path.yml
  publish:
    needs: install-path
    runs-on: ubuntu-latest
    if: github.repository == 'HumanjavaEnterprises/comfyui-lsdub'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - name: Release notes from the top released CHANGELOG section (checked against pyproject)
        run: |
          python3 scripts/release_notes.py --out "$RUNNER_TEMP/notes.md"
          { echo 'COMFY_NODE_CHANGELOG<<LSDUB_NOTES_EOF'; cat "$RUNNER_TEMP/notes.md"; echo 'LSDUB_NOTES_EOF'; } >> "$GITHUB_ENV"
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9   # main, 2026-10
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}   # set this secret in the repo settings
          skip_checkout: 'true'
