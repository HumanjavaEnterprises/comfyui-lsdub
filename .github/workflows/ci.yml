name: CI
on:
  pull_request:
  push:
    branches: [main, rack]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgles2 libegl1
      - name: Python deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu   # the DINOv2 load-by-path test
          pip install -r requirements.txt pytest ruff comfy-cli
      - name: Ruff (registry rules as errors)
        run: ruff check --select S102,S307,E702,F --target-version py310 .
      - name: Tests (ComfyUI stubbed, CPU)
        run: pytest -q tests
      - name: comfy node validate
        run: comfy --skip-prompt --no-enable-telemetry node validate
