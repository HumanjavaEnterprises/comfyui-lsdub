name: CI
on:
  pull_request:
  push:
    branches: [main, rack, "release/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deps: [floating, constraints]   # floating = the pyproject ranges; constraints = the hosted build's pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgles2 libegl1
      - name: Python deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu   # the DINOv2 load-by-path test
          if [ "${{ matrix.deps }}" = constraints ]; then CONSTRAINT="-c constraints-hosted.txt"; else CONSTRAINT=""; fi
          pip install -r requirements.txt pytest ruff==0.17.3 comfy-cli packaging $CONSTRAINT
          pip freeze | grep -iE '^(mediapipe|numpy|opencv|scipy|transformers)'
      - name: Ruff (registry rules as errors)
        run: ruff check --select S102,S307,E702,F --target-version py310 .
      - name: Tests (ComfyUI stubbed, CPU)
        run: pytest -q tests
      - name: Docs match the schemas and the models table
        run: python scripts/make_readme_nodes.py --check && python scripts/check_models_md.py
      - name: comfy node validate
        run: comfy --skip-prompt --no-enable-telemetry node validate
